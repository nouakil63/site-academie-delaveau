name: Modifier un formulaire Contact Form 7

on:
  workflow_dispatch:
    inputs:
      titre:
        description: "Titre exact du formulaire"
        required: true
        default: "Inscriptions stage 2026"
      ancien:
        description: "Texte à remplacer"
        required: false
      nouveau:
        description: "Nouveau texte"
        required: false
      propriete:
        description: "Partie modifiée : form (gabarit), mail.body (email), mail_2.body (email 2)"
        required: true
        default: "form"
      appliquer:
        description: "Appliquer la modification (sinon simulation)"
        type: boolean
        default: false
      afficher:
        description: "Afficher seulement le gabarit et les emails (ignore les autres champs)"
        type: boolean
        default: false

concurrency:
  group: wordpress-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cf7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer dans le formulaire
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TITRE: ${{ inputs.titre }}
          ANCIEN: ${{ inputs.ancien }}
          NOUVEAU: ${{ inputs.nouveau }}
          PROP: ${{ inputs.propriete }}
        run: |
          if [ "${{ inputs.afficher }}" = "true" ]; then
            python3 scripts/cf7_replace.py "$TITRE" --show
          else
            python3 scripts/cf7_replace.py "$TITRE" "$ANCIEN" "$NOUVEAU" --prop "$PROP" ${{ inputs.appliquer && '--apply' || '' }}
          fi
