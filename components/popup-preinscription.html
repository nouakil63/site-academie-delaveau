<style>
#adl-pi-pop {
  --pi-blue: #0050a1;
  --pi-blue-dark: #003e7f;
  --pi-dark: #101619;
  position: fixed;
  inset: 0;
  z-index: 99990;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  overflow: auto;
  border: 0;
  border-radius: 0;
  background: var(--pi-blue);
  color: #fff;
  font: 400 15px/1.7 "Manrope", Arial, sans-serif;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
#adl-pi-pop:not([open]) { display: none; }
#adl-pi-pop[open] { display: flex; flex-direction: column; }
#adl-pi-pop::backdrop { background: var(--pi-blue); }
#adl-pi-pop:focus { outline: none; }
#adl-pi-pop *, #adl-pi-pop *::before, #adl-pi-pop *::after { box-sizing: border-box; }
#adl-pi-pop .pi-deco { position: absolute; right: -2vw; bottom: -6vw; z-index: 0; margin: 0; font: 700 clamp(180px, 34vw, 560px)/.8 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1px #ffffff2e; pointer-events: none; user-select: none; }
#adl-pi-pop .pi-lines { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), #ffffff14 calc(25% - 1px) 25%); }
#adl-pi-pop .pi-inner { position: relative; z-index: 1; display: flex; flex: 1; flex-direction: column; width: 100%; max-width: 1560px; margin-inline: auto; padding: clamp(26px, 4vw, 56px) clamp(22px, 5.5vw, 96px); }
#adl-pi-pop .pi-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid #ffffff40; }
#adl-pi-pop .pi-kicker { display: flex; align-items: center; gap: 12px; margin: 0; font: 800 11px/1.6 "Manrope", Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
#adl-pi-pop .pi-kicker span { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px #ffffff26; }
#adl-pi-pop .pi-close { display: grid; place-items: center; flex-shrink: 0; width: 56px; height: 56px; padding: 0; border: 1px solid #ffffff80; border-radius: 0; background: transparent; color: #fff; font: 300 30px/1 Arial, sans-serif; cursor: pointer; transition: background .2s, color .2s; }
#adl-pi-pop .pi-close:hover { background: #fff; color: var(--pi-blue); }
#adl-pi-pop .pi-main { display: flex; flex: 1; flex-direction: column; justify-content: center; padding-block: clamp(36px, 6vh, 80px); }
#adl-pi-pop h2 { margin: 0; font: 600 clamp(64px, 11vw, 190px)/.86 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; letter-spacing: -.02em; text-transform: uppercase; color: #fff; }
#adl-pi-pop h2 > span { display: block; overflow: hidden; padding-bottom: .1em; margin-bottom: -.03em; }
#adl-pi-pop h2 > span > span { display: block; }
#adl-pi-pop h2 em { font-style: normal; color: transparent; -webkit-text-stroke: 1.5px #fff; }
#adl-pi-pop .pi-bottom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: end; margin-top: clamp(28px, 4vh, 48px); }
#adl-pi-pop .pi-text { max-width: 520px; margin: 0; font-size: 15px; line-height: 1.85; color: #e3edf9; }
#adl-pi-pop .pi-tracks { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
#adl-pi-pop .pi-tracks li { padding: 6px 12px; border: 1px solid #ffffff66; font: 800 10px/1.6 "Manrope", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
#adl-pi-pop .pi-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 26px; }
#adl-pi-pop .pi-cta { display: inline-flex; align-items: center; justify-content: space-between; gap: 40px; min-height: 64px; padding: 20px 28px; background: #fff; color: var(--pi-blue); font: 800 13px/1.4 "Manrope", Arial, sans-serif; text-decoration: none; transition: background .25s; }
#adl-pi-pop .pi-cta:hover { background: #e5eef8; }
#adl-pi-pop .pi-cta span { font-size: 26px; font-weight: 400; line-height: 1; transition: transform .3s; }
#adl-pi-pop .pi-cta:hover span { transform: translate(3px, -3px); }
#adl-pi-pop .pi-later { min-height: 44px; padding: 0; border: 0; background: none; color: #fff; font: 700 13px/1.4 "Manrope", Arial, sans-serif; text-decoration: underline; text-underline-offset: 5px; cursor: pointer; }
#adl-pi-pop .pi-later:hover { color: #d5e6f8; }
#adl-pi-pop :is(a, button):focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
#adl-pi-pop.pi-in { animation: pi-fade .5s ease both; }
#adl-pi-pop.pi-in h2 > span > span { animation: pi-line 1s cubic-bezier(.2, .7, .15, 1) both; }
#adl-pi-pop.pi-in h2 > span:nth-child(2) > span { animation-delay: .08s; }
#adl-pi-pop.pi-in h2 > span:nth-child(3) > span { animation-delay: .16s; }
@keyframes pi-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pi-line { from { transform: translateY(110%); } to { transform: none; } }
@media (max-width: 800px) {
  #adl-pi-pop .pi-bottom { grid-template-columns: 1fr; gap: 28px; }
  #adl-pi-pop .pi-lines { background: repeating-linear-gradient(90deg, transparent 0 calc(50% - 1px), #ffffff14 calc(50% - 1px) 50%); }
}
@media (max-width: 480px) {
  #adl-pi-pop h2 { font-size: clamp(50px, 15vw, 64px); }
  #adl-pi-pop .pi-close { width: 48px; height: 48px; }
  #adl-pi-pop .pi-actions { gap: 16px; }
  #adl-pi-pop .pi-cta { width: 100%; }
  #adl-pi-pop .pi-kicker { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #adl-pi-pop.pi-in, #adl-pi-pop.pi-in h2 > span > span { animation: none; }
}
</style>
<dialog id="adl-pi-pop" tabindex="-1" aria-labelledby="adl-pi-title" aria-describedby="adl-pi-text" lang="fr">
  <div class="pi-lines" aria-hidden="true"></div>
  <p class="pi-deco" aria-hidden="true">26</p>
  <div class="pi-inner">
    <div class="pi-top"><p class="pi-kicker"><span aria-hidden="true"></span>Académie Delaveau · Saison 2026-2027</p><button type="button" class="pi-close" data-pi-close aria-label="Fermer">×</button></div>
    <div class="pi-main">
      <h2 id="adl-pi-title"><span><span>Les pré-</span></span><span><span>inscriptions</span></span><span><span><em>sont ouvertes</em></span></span></h2>
      <div class="pi-bottom">
        <div><p class="pi-text" id="adl-pi-text">Élite, Espoir ou Le Lab : déposez votre candidature pour la saison 2026-2027 en quelques minutes.</p><ul class="pi-tracks" aria-label="Parcours"><li>Élite</li><li>Espoir</li><li>Le Lab</li></ul></div>
        <div class="pi-actions"><a class="pi-cta" href="https://www.academiedelaveau.com/pre-inscription-2026-2027/" data-pi-go>Je me pré-inscris<span aria-hidden="true">↗</span></a><button type="button" class="pi-later" data-pi-close>Plus tard</button></div>
      </div>
    </div>
  </div>
</dialog>
<script>
/* Annonce plein écran des pré-inscriptions : affichée une fois, puis plus pendant 7 jours après fermeture. */
(() => {
  "use strict";
  const KEY = "adl-preinscription-popup";
  const SNOOZE_DAYS = 7;
  function read() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) { return null; } }
  function write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (_) {} }
  function init() {
    const pop = document.getElementById("adl-pi-pop");
    if (!pop || pop.dataset.ready || typeof pop.showModal !== "function") return;
    pop.dataset.ready = "1";
    const state = read();
    if (state && (state.done || Date.now() - state.closed < SNOOZE_DAYS * 864e5)) return;
    if (pop.parentElement !== document.body) document.body.appendChild(pop);
    let shown = false;
    let opener = null;
    let overflow = "";
    let went = false;
    const cookieBanner = () => {
      const el = document.querySelector(".cookieadmin_law_container");
      if (!el) return false;
      const s = getComputedStyle(el);
      return s.display !== "none" && s.visibility !== "hidden" && el.getBoundingClientRect().height > 0;
    };
    function open() {
      if (shown) return;
      if (cookieBanner() || document.querySelector("dialog[open]")) { setTimeout(open, 2000); return; }
      shown = true;
      window.removeEventListener("scroll", onScroll);
      opener = document.activeElement;
      overflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = "hidden";
      pop.showModal();
      pop.classList.add("pi-in");
      pop.focus({ preventScroll: true });
    }
    function remember(done) { write(done ? { done: true, closed: Date.now() } : { closed: Date.now() }); }
    pop.addEventListener("close", () => {
      document.documentElement.style.overflow = overflow;
      if (!went) remember(false);
      if (opener && opener.focus && document.contains(opener)) opener.focus({ preventScroll: true });
    });
    function onScroll() {
      const max = document.documentElement.scrollHeight - innerHeight;
      if (max > 0 && scrollY / max > 0.35) open();
    }
    pop.querySelectorAll("[data-pi-close]").forEach((b) => b.addEventListener("click", () => pop.close()));
    pop.querySelector("[data-pi-go]").addEventListener("click", () => { went = true; remember(true); });
    window.addEventListener("scroll", onScroll, { passive: true });
    setTimeout(open, 5000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, { once: true });
  else init();
})();
</script>
<!-- popup-preinscription:end -->
