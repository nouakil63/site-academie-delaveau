<!-- menu-saison:start — corrige le libellé et le lien du bouton « Pré-inscription » du menu (extension adl_smart_menu). Généré depuis components/menu-saison.html via scripts/popup.py. -->
<script>
(() => {
  "use strict";
  const LABEL = "Pré-inscription 2027-2028";
  const HREF = "https://www.academiedelaveau.com/pre-inscription-2027-2028/";
  function fix() {
    document.querySelectorAll("#smart-header .nav-cta, #mobile-menu-overlay .nav-cta, .nav-cta.m-cta").forEach((a) => {
      if (/pré-inscription/i.test(a.textContent) && a.textContent.trim() !== LABEL) a.textContent = LABEL;
      if (/pre-inscription-2026-2027/.test(a.getAttribute("href") || "")) a.setAttribute("href", HREF);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fix, { once: true });
  else fix();
})();
</script>
<!-- menu-saison:end -->
